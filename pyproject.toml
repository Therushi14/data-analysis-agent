[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "An LLM agent that answers plain-English questions about a dataset by writing, running, and self-correcting Python in a sandbox."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
